<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPK · Price Per Token · 主流大模型厂商价格聚合</title>
  <meta name="description" content="PPK (Price Per Token) 聚合 OpenAI、Anthropic、Google、DeepSeek、智谱等主流大模型厂商的 Token 价格、订阅制与 Coding Plan">
  <base href="/ui/">
  <link rel="icon" type="image/svg+xml" href="icons/ppx.svg?v=2">
  <link rel="apple-touch-icon" href="icons/ppx.svg">
  <meta property="og:image" content="icons/ppx.svg">
  <meta property="og:title" content="PPK · Price Per Token">
  <meta property="og:description" content="主流大模型厂商价格聚合">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=67">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">

    <!-- ============ HEADER ============ -->
    <header class="header">
      <div class="header-inner">
        <a href="#/" class="brand">
          <img class="brand-mark" src="icons/ppx.svg" alt="PPK">
          <span class="brand-name">PPK</span>
          <span class="brand-tag">Price Per Token</span>
        </a>
        <nav class="nav-menu">
          <a href="#/" :class="{active: routeName === 'home'}">首页</a>
          <a href="#/billing/per_token" :class="{active: routeName === 'billing' && billingRoute === 'per_token'}">按需计费</a>
          <div class="nav-plans" :class="{active: plansMenuActive, open: plansMenuOpen}" @mouseenter="openPlansMenuOnHover" @mouseleave="closePlansMenuOnHover" @focusout="closePlansMenuOnFocusOut" @click.stop @keydown.esc.stop.prevent="closePlansMenu(true)">
            <button type="button" class="nav-plans-trigger" aria-haspopup="menu" :aria-expanded="plansMenuOpen" aria-controls="nav-plans-menu" @click="togglePlansMenu" @keydown.down.prevent="openPlansMenuAndFocus">
              <span>套餐</span><i aria-hidden="true">⌄</i>
            </button>
            <div v-if="plansMenuOpen" id="nav-plans-menu" class="nav-plans-menu" role="menu" aria-label="套餐">
              <a href="#/billing/subscription" role="menuitem" :class="{active: billingRoute === 'subscription'}">订阅制</a>
              <a href="#/billing/coding_plan" role="menuitem" :class="{active: billingRoute === 'coding_plan'}">Coding Plan</a>
            </div>
          </div>
          <a href="#/providers" :class="{active: routeName === 'providers' || routeName === 'provider'}">厂商</a>
          <a href="#/about" :class="{active: routeName === 'about'}">关于</a>
        </nav>
        <div class="header-actions">
          <div class="header-search" v-if="routeName === 'home' || routeName === 'compare' || routeName === 'billing' || routeName === 'provider' || routeName === 'providers'">
            <input
              class="search"
              v-model="globalSearch"
              placeholder="搜索厂商..."
              @focus="searchFocused = true"
              @blur="searchFocused = false"
              @keydown.enter="searchSubmit"
              @keydown.esc="globalSearch = ''"
            />
            <div class="search-suggestions" v-if="searchFocused && searchSuggestions.length">
              <a
                v-for="p in searchSuggestions"
                :key="p.id"
                class="search-suggestion"
                @mousedown.prevent="goProvider(p.id)"
              >
                <span class="provider-icon provider-icon--sm">
                  <img :src="iconUrl(p.id)" :alt="p.name" @error="onIconError($event, p.id)">
                </span>
                <div class="search-suggestion-text">
                  <div class="search-suggestion-name">{{ p.name }}</div>
                  <div class="search-suggestion-en" v-if="p.name_en && p.name_en !== p.name">{{ p.name_en }}</div>
                </div>
                <svg class="search-suggestion-arrow" width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                  <path d="M3 7H11M11 7L7 3M11 7L7 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
            </div>
          </div>
          <a href="https://github.com/hangliuc/llm-price-compare" target="_blank" class="gh-link" aria-label="GitHub">
            <svg class="gh-icon" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
          </a>
        </div>
      </div>
    </header>

    <!-- ============ LOADING ============ -->
    <div v-if="!data && !error" class="loading-state">加载中</div>

    <!-- ============ ERROR ============ -->
    <section v-if="error" class="error">
      <p>数据暂不可用：{{ error }}</p>
    </section>

    <!-- ============ 首页 ============ -->
    <template v-if="data && routeName === 'home'">
      <!-- Hero Area：主叙事 + AI Coding 生态延伸 -->
      <div class="home-hero-area">
        <!-- 不对称 Hero Main -->
        <section class="hero">
        <div class="hero-left">
          <h1 class="hero-title">选大模型<br><em>从定价开始</em></h1>
          <p class="hero-sub">聚合 OpenAI、Anthropic、Google、AWS、DeepSeek、智谱等主流厂商的 Token 计费、订阅制与 Coding Plan，帮助开发者快速对比与选型</p>
          <div class="hero-cta">
            <a href="#/compare" class="btn btn-primary">查看价格对比 →</a>
            <a href="#/providers" class="btn btn-secondary">浏览厂商</a>
          </div>
        </div>
        <div class="hero-right">
          <div class="icon-orbit">
            <div class="orbit-ring orbit-ring-1"></div>
            <div class="orbit-ring orbit-ring-2"></div>
            <div class="orbit-ring orbit-ring-3"></div>
            <div class="orbit-core">
              <img class="brand-mark" src="icons/ppx.svg" alt="PPK">
            </div>
            <div
              v-for="(p, i) in allProvidersForOrbit"
              :key="p.id"
              class="orbit-icon"
              :style="orbitStyle(i, allProvidersForOrbit.length)"
            >
              <img :src="iconUrl(p.id)" :alt="p.name" @error="onIconError($event, p.id)">
            </div>
          </div>
        </div>
        </section>

        <!-- Hero 内的 AI Coding 工具带 -->
        <section class="home-ide-section" aria-labelledby="home-ide-title">
          <div class="home-ide-head">
            <h2 id="home-ide-title">AI Coding 工具</h2>
            <span class="home-ide-meta">{{ codingIDEs.length }} tools</span>
          </div>
        <div class="home-ide-flow-stack">
          <div v-for="(row, rowIndex) in codingIDERows" :key="rowIndex" class="home-ide-rail" :class="rowIndex === 1 ? 'home-ide-rail--reverse' : 'home-ide-rail--forward'" :aria-label="'AI Coding 工具流，第 ' + (rowIndex + 1) + ' 行'">
            <div class="home-ide-track">
              <div v-for="group in 2" :key="group" class="home-ide-group" :aria-hidden="group === 2 ? 'true' : null">
                <a v-for="ide in row" :key="group + '-' + ide.id" :href="ide.url" target="_blank" rel="noopener noreferrer" class="home-ide-item" :tabindex="group === 2 ? -1 : null">
                  <span class="home-ide-logo"><img :src="ide.logo" :alt="ide.name"></span>
                  <span class="home-ide-copy"><b>{{ ide.name }}</b></span>
                  <i class="home-ide-arrow" aria-hidden="true">↗</i>
                </a>
              </div>
            </div>
          </div>
        </div>
        </section>
      </div>

      <!-- Pricing Overview -->
      <section class="section home-billing-section">
        <div class="section-head home-section-head">
          <div>
            <div class="section-eyebrow">2 PRICING TYPES</div>
            <h2 class="section-title">两种方式，<em>看懂 AI 定价</em></h2>
            <p class="section-sub">AI 产品的价格大致分为两类：按实际使用量付费，或按固定周期购买套餐。</p>
          </div>
        </div>
        <div class="home-billing-types">
          <article v-for="slide in billingSlides" :key="slide.index" class="home-billing-type">
            <div class="home-billing-type-head">
              <span class="home-billing-copy"><small>{{ slide.label }}</small><b>{{ slide.name }}</b></span>
            </div>
            <div class="home-billing-visual"><img :src="slide.image" :alt="slide.name + ' 示意图'" loading="lazy"></div>
            <div class="home-billing-body">
              <h3>{{ slide.value }}</h3>
              <p><span class="home-billing-note-label">计费规则</span>{{ slide.desc }}</p>
              <p class="home-billing-examples"><span class="home-billing-note-label">{{ slide.exampleLabel }}</span>{{ slide.examples.join(' · ') }}</p>
            </div>
          </article>
        </div>
      </section>

      <!-- 真实价格预览 -->
      <section class="section home-pricing-section home-surface home-surface--pricing">
        <div class="section-head home-section-head">
          <div>
            <div class="section-eyebrow">LIVE PRICING · OFFICIAL</div>
            <h2 class="section-title">先看价格，<em>再做选择</em></h2>
            <p class="section-sub">浏览各厂商最新旗舰模型的输入、输出与缓存报价；国内厂商仅展示中国大陆官方人民币价，未接入大陆官方价的模型暂不展示。</p>
          </div>
          <a href="#/billing/per_token" class="section-link home-pricing-cta">查看全部价格 →</a>
        </div>
        <div class="home-price-table">
          <div class="home-price-row home-price-head" aria-hidden="true">
            <span>Model</span><span><b>Input</b><small>报价 / 1M tokens</small></span><span><b>Output</b><small>报价 / 1M tokens</small></span><span><b>Cache</b><small>报价 / 1M tokens</small></span><span><b>Context</b><small>tokens</small></span><span class="home-price-action-head">查看</span>
          </div>
          <div v-for="row in homePreviewRows" :key="row.id" class="home-price-row">
            <a :href="'#/provider/' + row.providerId" class="home-price-model" :aria-label="'查看 ' + row.providerName + ' 的 ' + homeModelName(row) + ' 详细价格'">
              <span class="provider-icon"><img :src="iconUrl(row.providerId)" :alt="row.providerName" @error="onIconError($event, row.providerId)"></span>
              <span><b>{{ homeModelName(row) }}</b><small>{{ row.providerName }}</small></span>
            </a>
            <span class="home-price-value"><small>Input · {{ homePriceCaption(row, 'input') }}</small><b>{{ formatHomePriceAmount(row, 'input') }}</b><em v-if="formatHomeOriginalPrice(row, 'input')">{{ formatHomeOriginalPrice(row, 'input') }}</em><em v-else-if="formatReferenceCny(row, 'input')">{{ formatReferenceCny(row, 'input') }}</em></span>
            <span class="home-price-value"><small>Output · {{ homePriceCaption(row, 'output') }}</small><b>{{ formatHomePriceAmount(row, 'output') }}</b><em v-if="formatHomeOriginalPrice(row, 'output')">{{ formatHomeOriginalPrice(row, 'output') }}</em><em v-else-if="formatReferenceCny(row, 'output')">{{ formatReferenceCny(row, 'output') }}</em></span>
            <span class="home-price-value"><small>Cache · {{ homePriceCaption(row, 'cached_input') }}</small><b>{{ formatHomePriceAmount(row, 'cached_input') }}</b><em v-if="homeCacheNote(row)">{{ homeCacheNote(row) }}</em><em v-else-if="formatHomeOriginalPrice(row, 'cached_input')">{{ formatHomeOriginalPrice(row, 'cached_input') }}</em><em v-else-if="formatReferenceCny(row, 'cached_input')">{{ formatReferenceCny(row, 'cached_input') }}</em></span>
            <span class="home-price-context">
              <small>Context</small><span>{{ formatContext(row.context_window) }}</span>
            </span>
            <span class="home-price-action">
              <a :href="row.purchase_url" target="_blank" rel="noopener" class="home-price-source-link" :aria-label="'打开 ' + homeModelName(row) + ' 的官方定价页'" title="打开官方定价页">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h9M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
            </span>
          </div>
        </div>
        <a href="#/billing/per_token" class="section-link home-pricing-cta-mobile">查看全部价格 →</a>
      </section>

      <!-- 真实模型对比 -->
      <section id="home-model-compare" class="section home-why-section home-surface home-surface--compare">
        <div class="home-why-intro">
          <div class="section-eyebrow">MODEL COMPARE · OFFICIAL</div>
          <h2 class="section-title">同一视角，<br><em>看清模型差异</em></h2>
          <p class="section-sub">选择三个候选模型，直接比较输入、输出、缓存和上下文；最低价按人民币参考价判断。</p>
          <a href="#/compare" class="section-link home-compare-link">进入完整对比 →</a>
        </div>
        <div class="home-compare-preview" aria-label="代表模型价格对比">
          <div class="home-compare-row home-compare-models">
            <span>模型</span>
            <div v-for="(row, columnIndex) in homeCompareRows" :key="columnIndex" class="home-model-picker-wrap" @click.stop>
              <button type="button" class="home-model-trigger" :data-home-model-trigger="columnIndex" :title="row.model" :aria-label="'更换模型：' + row.model + '，' + row.providerName" :aria-expanded="homeModelPickerIndex === columnIndex" aria-haspopup="listbox" :aria-controls="'home-model-options-' + columnIndex" @click="openHomeModelPicker(columnIndex)">
                <span class="provider-icon"><img :src="iconUrl(row.providerId)" :alt="row.providerName" @error="onIconError($event, row.providerId)"></span>
                <span class="home-model-trigger-copy"><b>{{ row.model }}</b><small>{{ row.providerName }}</small></span>
                <i aria-hidden="true">⌄</i>
              </button>
              <div v-if="homeModelPickerIndex === columnIndex" class="home-model-picker" :data-home-picker="columnIndex" @keydown="handleHomeModelPickerKeydown">
                <label class="home-model-search">
                  <span class="sr-only">搜索模型或厂商</span>
                  <input v-model="homeModelPickerQuery" type="search" placeholder="搜索模型或厂商…" autocomplete="off" role="combobox" aria-autocomplete="list" :aria-controls="'home-model-options-' + columnIndex" :aria-expanded="true">
                </label>
                <div :id="'home-model-options-' + columnIndex" class="home-model-options" role="listbox" :aria-label="'为第 ' + (columnIndex + 1) + ' 列选择模型'">
                  <button v-for="option in homeModelPickerRows(columnIndex)" :key="option.id" type="button" class="home-model-option" role="option" :aria-selected="option.id === row.id" @click="selectHomeCompareModel(columnIndex, option)">
                    <span class="provider-icon"><img :src="iconUrl(option.providerId)" :alt="option.providerName" @error="onIconError($event, option.providerId)"></span>
                    <span><b>{{ option.model }}</b><small>{{ option.providerName }}</small></span>
                    <i v-if="option.id === row.id" aria-hidden="true">✓</i>
                  </button>
                  <p v-if="!homeModelPickerRows(columnIndex).length" class="home-model-empty">没有匹配的模型</p>
                </div>
              </div>
            </div>
          </div>
          <div class="home-compare-row"><span>输入 / 1M</span><b v-for="row in homeCompareRows" :key="row.id + '-input'" :class="['home-compare-value', { 'is-lowest': isHomeCompareLowest(row, 'input') }]"><span>{{ formatPriceAmount(row, 'input') }}</span><small>{{ formatReferenceCny(row, 'input') }}</small></b></div>
          <div class="home-compare-row"><span>输出 / 1M</span><b v-for="row in homeCompareRows" :key="row.id + '-output'" :class="['home-compare-value', { 'is-lowest': isHomeCompareLowest(row, 'output') }]"><span>{{ formatPriceAmount(row, 'output') }}</span><small>{{ formatReferenceCny(row, 'output') }}</small></b></div>
          <div class="home-compare-row"><span>缓存 / 1M</span><b v-for="row in homeCompareRows" :key="row.id + '-cache'" :class="['home-compare-value', { 'is-lowest': isHomeCompareLowest(row, 'cached_input') }]"><span>{{ formatPriceAmount(row, 'cached_input') }}</span><small>{{ formatReferenceCny(row, 'cached_input') }}</small></b></div>
          <div class="home-compare-row"><span>上下文</span><b v-for="row in homeCompareRows" :key="row.id + '-context'" class="home-compare-value">{{ formatContext(row.context_window) }}</b></div>
        </div>
      </section>

      <!-- 套餐预览 -->
      <section class="section home-plans-section">
        <div class="section-head home-section-head">
          <div>
            <div class="section-eyebrow">PLANS</div>
            <h2 class="section-title">不只 Token，<em>也看套餐</em></h2>
            <p class="section-sub">从通用 AI 订阅到 Coding Plan 与开发者套餐，一处查看月费与权益。</p>
          </div>
          <div class="home-plans-entry" :class="{open: homePlansMenuOpen}" @click.stop @focusout="closeHomePlansMenuOnFocusOut" @keydown.esc.stop.prevent="closeHomePlansMenu(true)">
            <button type="button" class="section-link home-plans-trigger" aria-haspopup="menu" :aria-expanded="homePlansMenuOpen" aria-controls="home-plans-menu" @click="toggleHomePlansMenu" @keydown.down.prevent="openHomePlansMenuAndFocus">查看全部套餐 <span aria-hidden="true">⌄</span></button>
            <div v-if="homePlansMenuOpen" id="home-plans-menu" class="home-plans-menu" role="menu" aria-label="查看套餐">
              <a href="#/billing/subscription" role="menuitem">订阅制</a>
              <a href="#/billing/coding_plan" role="menuitem">Coding Plan</a>
            </div>
          </div>
        </div>
        <div class="home-plan-grid">
          <a v-for="plan in homePlanRows" :key="plan.id" :href="plan.billing_type === 'coding_plan' ? '#/billing/coding_plan' : '#/billing/subscription'" class="home-plan-item">
            <div class="home-plan-top">
              <span class="home-price-model"><span class="provider-icon"><img :src="iconUrl(plan.providerId)" :alt="plan.providerName" @error="onIconError($event, plan.providerId)"></span><b>{{ plan.providerName }}</b></span>
              <small>{{ billingLabel(plan.billing_type) }}</small>
            </div>
            <h3>{{ plan.model }}</h3>
            <div class="home-plan-price"><span>{{ currencySymbol(plan) }}</span><b>{{ formatMonthlyValue(plan) }}</b><small>/月</small></div>
            <p>{{ formatQuota(plan) }}</p>
          </a>
        </div>
      </section>

      <!-- 数据可信度 -->
      <section class="section home-trust-section home-surface home-surface--trust">
        <div class="home-trust-copy">
          <div class="section-eyebrow">OPEN DATA · TRACEABLE</div>
          <h2 class="section-title">价格数据，<em>有迹可循</em></h2>
          <p>按需报价保留官方市场与原币；人民币参考价仅用于排序和比较。校验失败时继续使用最近一次成功发布的数据。</p>
        </div>
        <div class="home-trust-facts">
          <div><strong>{{ catalogTotalModels }}</strong><span>可比较模型报价</span></div>
          <div><strong>{{ freshnessText }}</strong><span>最近一次数据更新</span></div>
          <a href="https://github.com/hangliuc/llm-price-compare" target="_blank"><strong>Open Source ↗</strong><span>查看代码与数据来源</span></a>
        </div>
      </section>

      <!-- FAQ + 社群 -->
      <section class="section faq-community">
        <div class="faq-community-grid">
          <!-- FAQ -->
          <div class="faq-block">
            <h2 class="section-title">常见问题</h2>
            <div class="faq-list">
              <details class="faq-item">
                <summary>这里的价格可靠吗？多久更新一次？</summary>
                <div class="faq-answer">
                  <p>数据每天自动更新两次。按需目录来自 Models.dev 与已验证的官方市场 Adapter；套餐来自厂商官方页面。人民币参考价使用发布时保存的日度汇率快照，抓取或校验失败时不会覆盖最近一次成功发布的数据。</p>
                </div>
              </details>
              <details class="faq-item">
                <summary>按需计费和套餐有什么区别？</summary>
                <div class="faq-answer">
                  <p><b>按需计费</b>按实际 Token 用量收费，适合 API 调用；<b>套餐</b>按周期或额度购买，适合用量相对固定的订阅和编程场景。</p>
                </div>
              </details>
              <details class="faq-item">
                <summary>Input、Output 和 Cache Read 是什么？</summary>
                <div class="faq-answer">
                  <p><b>Input</b> 是发送给模型的内容，<b>Output</b> 是模型生成的回复；<b>Cache Read</b> 是读取已缓存上下文的费用，通常低于普通输入价。</p>
                </div>
              </details>
              <details class="faq-item">
                <summary>发现价格有误或缺少厂商怎么办？</summary>
                <div class="faq-answer">
                  <p>欢迎通过 <a :href="feedbackUrl" target="_blank">GitHub Issues</a> 提交价格纠错或厂商建议，也可以加入飞书社群直接反馈。</p>
                </div>
              </details>
            </div>
          </div>

          <!-- 社群 -->
          <div class="community-block">
            <h2 class="section-title">加入社群</h2>
            <p class="section-sub">讨论模型选型与 AI 成本，也欢迎反馈价格数据。</p>
            <div class="community-card">

                <div class="about-provider-en" v-if="p.name_en && p.name_en !== p.name">{{ p.name_en }}</div>
              </div>
              <span class="about-provider-region" :class="p.region">{{ p.region === 'cn' ? '国内' : (p.region === 'us' ? '美国' : '欧洲') }}</span>
            </div>
          </div>

          <!-- 数据采集流程 -->
          <h2>采集<em>流程</em></h2>
          <p>数据链路保持单一职责，不进行多来源字段拼接：</p>
          <ol class="about-flow">
            <li>
              <span class="about-flow-num">1</span>
              <div>
                <strong>Models.dev 与官方市场 Adapter</strong> — 自动获取模型名称、Input、Output、Cache、Context 与模态等按需计费数据；不同市场报价独立保留。
              </div>
            </li>
            <li>
              <span class="about-flow-num">2</span>
              <div>
                <strong>厂商官方页面</strong> — 每个套餐由对应官方 Adapter 自动抓取价格、计费周期和额度信息。
              </div>
            </li>
            <li>
              <span class="about-flow-num">3</span>
              <div>
                <strong>校验与发布</strong> — 对数量、必填字段和重复身份进行校验，通过后原子发布完整 Catalog。
              </div>
            </li>
          </ol>
          <p class="about-note">PPK 不人工编辑线上价格，也不在多个来源之间做自动仲裁。数据异常会阻断整次发布，并保留最近一次成功 Catalog。</p>

          <!-- 历史数据 -->
          <h2>历史<em>追溯</em></h2>
          <p>每次任务、原始响应、Catalog 快照和正式 Release 都写入持久化 SQLite 与快照目录，可按运行和来源追踪。数据通过原子替换发布，失败任务不会覆盖线上版本。</p>

          <!-- 技术栈 -->
          <h2>技术<em>栈</em></h2>
          <ul>
            <li><strong>数据采集</strong>：Python + Requests + Playwright；Models.dev、官方市场与官方套餐 Adapter；日度汇率快照仅用于人民币比较。</li>
            <li><strong>数据存储</strong>：SQLite（运行、历史与发布审计）+ JSON（前端数据契约）</li>
            <li><strong>前端</strong>：Vue 3 CDN（无构建步骤）+ Instrument Serif / Geist / Geist Mono 三层字体系统</li>
            <li><strong>调度与部署</strong>：systemd timer + Docker Compose；数据更新无需 Git push 或重建 Web</li>
            <li><strong>运行状态</strong>：systemd Journal + SQLite 运行记录与原始响应快照</li>
          </ul>

          <!-- 反馈 -->
          <h2>反馈<em>与贡献</em></h2>
          <p>本项目开源且非商业。如发现价格错误、数据过期或有新厂商建议，欢迎通过以下方式参与：</p>
          <ul>
            <li><a :href="feedbackUrl" target="_blank">GitHub Issues</a> — 提交价格纠错或新厂商建议（含预填模板）</li>
            <li><a href="https://github.com/hangliuc/llm-price-compare" target="_blank">GitHub 仓库</a> — 查看源码、提交 PR</li>
          </ul>
          <p class="about-note">数据仅供参考，实际价格以厂商官方为准。本项目不对数据准确性作出担保。</p>

        </div>
      </section>
