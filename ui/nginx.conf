server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # The public canonical URL is the domain root.  Keep /ui/ working for
    # existing links while serving the same app at / for crawlers and users.
    location = / {
        try_files /ui/index.html =404;
    }
    location = /ui {
        return 301 /;
    }
    location = /ui/ {
        try_files /ui/index.html =404;
    }
    location /ui/ {
        try_files $uri =404;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files /data/seo/sitemap.xml /sitemap.xml =404; }
    location = /methodology.html { alias /usr/share/nginx/html/ui/methodology.html; }

    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Generated provider pages are directory indexes. Resolve the canonical
    # trailing-slash URLs explicitly instead of letting the catch-all try_files
    # treat the directory itself as a missing static file.
    location ~ ^/providers/([a-z0-9_-]+)/$ {
        try_files /providers/$1/index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
