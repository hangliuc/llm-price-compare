services:
  pipeline:
    build: .
    profiles: ["pipeline"]
    environment:
      - TZ=Asia/Shanghai
      - PPK_RUNTIME_DIR=/var/lib/ppk
      - PPK_DB_PATH=/var/lib/ppk/ppk.db
      - PPK_CATALOG_PATH=/app/public/catalog.json
      - PPK_STATUS_PATH=/app/public/status.json
      - PPK_RELEASES_DIR=/var/lib/ppk/releases
      - PPK_RAW_DIR=/var/lib/ppk/raw
      - PPK_LOCK_PATH=/var/lib/ppk/pipeline.lock
      - PPK_MINIMUM_OFFER_COUNT=250
      - PPK_MINIMUM_PLAN_COUNT=30
    volumes:
      - ./runtime/public:/app/public
      - ./runtime:/var/lib/ppk
    command: ["run"]

  web:
    image: nginx:alpine
    container_name: llm-price-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./ui:/usr/share/nginx/html/ui:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ui/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./ui/sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./runtime/public:/usr/share/nginx/html/data:ro
      - ./runtime/public/seo/providers:/usr/share/nginx/html/providers:ro
