services:
  pipeline:
    build: .
    profiles: ["pipeline"]
    environment:
      - TZ=Asia/Shanghai
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - PPK_OUTPUT_PATH=/app/public/prices.json
      - PPK_STATUS_PATH=/app/public/run_status.json
      - PPK_MANUAL_DIR=/app/data/manual
      - PPK_RUNTIME_DIR=/var/lib/ppk
    volumes:
      - ./data:/app/data:ro
      - ./runtime/public:/app/public
      - ./runtime:/var/lib/ppk

  web:
    image: nginx:alpine
    container_name: llm-price-web
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./ui:/usr/share/nginx/html/ui:ro
      - ./runtime/public:/usr/share/nginx/html/data:ro
