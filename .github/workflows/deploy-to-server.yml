name: Deploy to Server

on:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -eu
            cd /root
            if [ ! -d llm-price-compare ]; then
              git clone git@github.com:hangliuc/llm-price-compare.git
            fi
            cd llm-price-compare

            git pull --ff-only origin master

            mkdir -p runtime/public runtime/releases runtime/raw
            chmod 0755 runtime runtime/public runtime/releases runtime/raw

            docker compose config --quiet
            docker compose --profile pipeline build pipeline

            # Bootstrap on a fresh server. During the one-time 3.0 -> 3.1
            # migration, publish a V3.1 Catalog as well so the UI and its
            # native-currency contract are upgraded together. Normal code
            # deployments do not fetch data; the systemd timer owns that
            # lifecycle.
            if [ ! -s runtime/public/catalog.json ] || [ ! -s runtime/public/status.json ]; then
              docker compose --profile pipeline run --rm pipeline run --official-markets
            elif ! grep -q '"schema_version"[[:space:]]*:[[:space:]]*"3.1"' runtime/public/catalog.json; then
              docker compose --profile pipeline run --rm pipeline run --official-markets
            fi
            find runtime/public -maxdepth 1 -type f -name '*.json' -exec chmod 0644 {} \;
            docker compose up -d --build --remove-orphans web

            systemctl disable --now ppk-v2-payg.timer ppk-v2-plans.timer ppk-v2-full-verify.timer ppk-v3-candidate.timer 2>/dev/null || true
            rm -f /etc/systemd/system/ppk-v2-payg.service /etc/systemd/system/ppk-v2-payg.timer
            rm -f /etc/systemd/system/ppk-v2-plans.service /etc/systemd/system/ppk-v2-plans.timer
            rm -f /etc/systemd/system/ppk-v2-full-verify.service /etc/systemd/system/ppk-v2-full-verify.timer
            rm -f /etc/systemd/system/ppk-v3-candidate.service /etc/systemd/system/ppk-v3-candidate.timer
            install -m 0644 ops/systemd/ppk-data-pipeline.service /etc/systemd/system/ppk-data-pipeline.service
            install -m 0644 ops/systemd/ppk-data-pipeline.timer /etc/systemd/system/ppk-data-pipeline.timer
            systemctl daemon-reload
            systemctl enable --now ppk-data-pipeline.timer
            systemctl restart ppk-data-pipeline.timer

            # Remove obsolete runtime artifacts only after the V3 Catalog has
            # been published successfully.
            rm -rf runtime/v2 runtime/v3 runtime/public/v2 runtime/public/v3-candidate

            docker compose ps
            systemctl is-active ppk-data-pipeline.timer
            curl --fail --silent --show-error http://127.0.0.1:8001/ui/ >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:8001/data/catalog.json >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:8001/data/status.json >/dev/null
            echo "Deployed at $(date)"
