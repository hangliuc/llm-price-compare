name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "ui/**"
      - "data/**"
      - "scripts/pipeline_v2/**"
      - "scripts/sources/**"
      - "scripts/adapters/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build V2 catalog
        run: |
          docker compose --profile pipeline build pipeline-v2
          docker compose --profile pipeline run --rm pipeline-v2 run --profile full-verify
      - name: Build
        run: |
          # Keep the same /data/v2 contract as the production Nginx site.
          mkdir -p _site
          cp -r ui/* _site/
          mkdir -p _site/data/v2
          cp runtime/public/v2/catalog.json runtime/public/v2/status.json _site/data/v2/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
