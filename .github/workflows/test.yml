name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests (skip browser)
        env:
          # Tests import the repository's `scripts` package.  The pytest
          # console entry point does not reliably put the checkout root on
          # sys.path in GitHub Actions.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest scripts/ -v -m "not browser"
